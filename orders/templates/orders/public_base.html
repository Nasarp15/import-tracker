<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ business_name }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f3; color: #1c1c1a; }
    header { padding: 16px; background: #fff; border-bottom: 1px solid #e3e3df; text-align: center; }
    header h1 { margin: 0; font-size: 20px; }
    header nav { margin-top: 8px; display: flex; gap: 18px; justify-content: center; font-size: 14px; }
    header nav a { color: #1f6f5c; text-decoration: none; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 17px; margin: 18px 0 10px; }
    .muted { color: #6b6b66; font-size: 13px; margin-top: 2px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #55554f; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #cfcfc9; border-radius: 8px; background: #fff; font-family: inherit; }
    .errorlist { margin: 4px 0 0; padding: 0; list-style: none; color: #b3261e; font-size: 13px; }
    button { display: block; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #1f6f5c; color: #fff; cursor: pointer; }
    .back { color: #55554f; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>{{ business_name }}</h1>
    <nav><a href="{% url 'shop' %}">Shop</a><a href="{% url 'track_home' %}">Track my order</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
