{% extends "orders/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Welcome back</h1><p class="page-description">Log in to manage orders, shipments and inventory.</p></div></div>
<div class="card form-panel" style="max-width:480px"><form method="post" action="{% url 'login' %}">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Log in</button></form></div>
{% endblock %}
